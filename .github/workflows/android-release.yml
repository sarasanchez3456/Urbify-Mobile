name: Android Release Build

# Compila y firma la variante release. Solo corre en eventos que pueden ver
# secrets del repo (tags y workflow_dispatch) — nunca en pull_request, para
# no exponer la firma de producción a un PR (ni siquiera de este mismo repo).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Materializa el keystore SOLO en este runner efímero, nunca en el repo:
      # - Se guarda como secret en base64 (RELEASE_KEYSTORE_BASE64) para poder
      #   pasarlo por una variable de entorno sin problemas de binarios/encoding.
      # - Se decodifica a $RUNNER_TEMP, un directorio temporal del runner que
      #   se destruye junto con la VM al terminar el job (no es parte del
      #   workspace ni de ningún artifact subido).
      # - Nunca se hace `cat`/`echo` de su contenido ni de las contraseñas: el
      #   paso solo referencia la RUTA (no secreta) del archivo.
      - name: Materializar keystore de release desde secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Falta el secret RELEASE_KEYSTORE_BASE64 en este repo/entorno." >&2
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Validar firma de release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew checkReleaseSigningConfig

      - name: Build release (APK + AAB)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      # El glob solo apunta a app/build/outputs: el .jks materializado en
      # $RUNNER_TEMP nunca queda incluido acá.
      - name: Subir APK/AAB release
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Borrar keystore temporal
        # No es estrictamente necesario (el runner se destruye al terminar el
        # job), pero es defensa en profundidad: si el job falla a mitad de
        # camino, no queremos que el archivo sobreviva a ningún paso posterior.
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
