name: Unit tests

# Corre la suite de tests unitarios (repositorios, serialización Gson,
# ViewModels) en cada PR. No necesita backend ni secrets: los repositorios se
# testean contra MockWebServer y los ViewModels con repos/ApiService
# mockeados (MockK) — ver docs/TESTING.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
